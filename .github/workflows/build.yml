name: Build LightDraw

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 26.1.10909125

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android,
            i686-linux-android

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
          key: rust-${{ hashFiles('rust-engine/Cargo.lock', 'rust-engine/Cargo.toml') }}
          restore-keys: rust-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Configure Cargo for Android NDK
        run: |
          NDK_HOME="$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.aarch64-linux-android]
          ar = "$TOOLCHAIN/bin/llvm-ar"
          linker = "$TOOLCHAIN/bin/aarch64-linux-android24-clang"

          [target.armv7-linux-androideabi]
          ar = "$TOOLCHAIN/bin/llvm-ar"
          linker = "$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang"

          [target.x86_64-linux-android]
          ar = "$TOOLCHAIN/bin/llvm-ar"
          linker = "$TOOLCHAIN/bin/x86_64-linux-android24-clang"

          [target.i686-linux-android]
          ar = "$TOOLCHAIN/bin/llvm-ar"
          linker = "$TOOLCHAIN/bin/i686-linux-android24-clang"
          EOF

      - name: Build Rust engine for all ABIs
        working-directory: rust-engine
        run: |
          declare -A ABI_MAP=(
            ["aarch64-linux-android"]="arm64-v8a"
            ["armv7-linux-androideabi"]="armeabi-v7a"
            ["x86_64-linux-android"]="x86_64"
            ["i686-linux-android"]="x86"
          )

          for target in "${!ABI_MAP[@]}"; do
            echo "::group::Building $target"
            cargo build --release --target "$target"
            echo "::endgroup::"

            abi="${ABI_MAP[$target]}"
            jni_dir="../app/src/main/jniLibs/$abi"
            mkdir -p "$jni_dir"
            cp "target/$target/release/liblightdraw_engine.so" "$jni_dir/"
          done

      - name: Build APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build APK (release, unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lightdraw-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lightdraw-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Rust .so libraries
        uses: actions/upload-artifact@v4
        with:
          name: rust-jni-libs
          path: app/src/main/jniLibs/
          retention-days: 14

  # Optional: signed release build
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Rust .so libs
        uses: actions/download-artifact@v4
        with:
          name: rust-jni-libs
          path: app/src/main/jniLibs/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

          BUILD_TOOLS="$(ls -d $ANDROID_SDK_ROOT/build-tools/*/ | sort -V | tail -1)"
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -1)

          "${BUILD_TOOLS}zipalign" -v 4 "$UNSIGNED" app-release-aligned.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            app-release-aligned.apk

          rm keystore.jks

      - name: Upload signed APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        with:
          name: lightdraw-release-signed
          path: app-release-aligned.apk
          retention-days: 30
