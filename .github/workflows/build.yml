name: Build LightDraw APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NDK_VERSION: "26.3.11579264"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Unpack ZIP kalau ada
        run: |
          set -e
          shopt -s nullglob
          for z in *.zip; do echo "unpack $z"; unzip -oq "$z" -d .; done
          ROOT=$(find . -maxdepth 3 -name 'settings.gradle.kts' -not -path './.git/*' | head -n1 | xargs -r dirname)
          echo "PROJECT_ROOT=${ROOT:-.}" >> $GITHUB_ENV
          echo "root = ${ROOT:-.}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.PROJECT_ROOT }}/rust-engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust engine
        working-directory: ${{ env.PROJECT_ROOT }}/rust-engine
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release
          find ../app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - name: Gradle wrapper kalau belum ada
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ ! -f gradlew ]; then
            GV=$(grep -oP 'gradle-\K[0-9.]+(?=-bin|-all)' gradle/wrapper/gradle-wrapper.properties || echo 8.7)
            curl -sL "https://services.gradle.org/distributions/gradle-${GV}-bin.zip" -o /tmp/g.zip
            unzip -q /tmp/g.zip -d /tmp/gradle
            /tmp/gradle/gradle-${GV}/bin/gradle wrapper --gradle-version "$GV"
          fi
          chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LightDraw-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Log kalau gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ env.PROJECT_ROOT }}/**/build/reports/**
          if-no-files-found: ignore
