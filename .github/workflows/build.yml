name: Build LightDraw

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 26.1.10909125

defaults:
  run:
    working-directory: src

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        working-directory: .
        run: |
          unzip -q LightDraw.zip -d _unzipped
          # isi ZIP ada di _unzipped/LightDraw/, pindah ke src/
          mv _unzipped/LightDraw src
          echo "=== struktur project ==="
          ls -la src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        working-directory: .
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${{ env.NDK_VERSION }}" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android,
            i686-linux-android

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ github.sha }}
          restore-keys: rust-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.sha }}
          restore-keys: gradle-

      - name: Configure Cargo for Android NDK
        working-directory: .
        run: |
          NDK_HOME="$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.aarch64-linux-android]
          ar = "$TOOLCHAIN/bin/llvm-ar"
          linker = "$TOOLCHAIN/bin/aarch64-linux-android24-clang"

          [target.armv7-linux-androideabi]
          ar = "$TOOLCHAIN/bin/llvm-ar"
          linker = "$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang"

          [target.x86_64-linux-android]
          ar = "$TOOLCHAIN/bin/llvm-ar"
          linker = "$TOOLCHAIN/bin/x86_64-linux-android24-clang"

          [target.i686-linux-android]
          ar = "$TOOLCHAIN/bin/llvm-ar"
          linker = "$TOOLCHAIN/bin/i686-linux-android24-clang"
          EOF

      - name: Build Rust engine for all ABIs
        working-directory: src/rust-engine
        run: |
          declare -A ABI_MAP=(
            ["aarch64-linux-android"]="arm64-v8a"
            ["armv7-linux-androideabi"]="armeabi-v7a"
            ["x86_64-linux-android"]="x86_64"
            ["i686-linux-android"]="x86"
          )

          for target in "${!ABI_MAP[@]}"; do
            echo "::group::Building $target"
            cargo build --release --target "$target"
            echo "::endgroup::"

            abi="${ABI_MAP[$target]}"
            jni_dir="../app/src/main/jniLibs/$abi"
            mkdir -p "$jni_dir"
            cp "target/$target/release/liblightdraw_engine.so" "$jni_dir/"
          done

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew tidak ada, generate wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lightdraw-debug
          path: src/app/build/outputs/apk/debug/*.apk
          retention-days: 14
